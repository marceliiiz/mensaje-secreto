<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Secreto</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;

      background-image: url("img/mensajesecreto.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Para que el texto se vea mejor sobre la imagen */
    .caja {
      background: rgba(255, 255, 255, 0.8);
      padding: 15px;
      border-radius: 12px;
      max-width: 400px;
    }
  </style>
</head>

<body>

  <div class="caja">
    <h2>💖 Zona secreta</h2>

    <p id="saludo"></p>

    <div id="juguera">
      <h3>🍹 Jugo sorpresa</h3>
      <button onclick="hacerJugo()">Hacer jugo</button>
      <p id="resultadoJugo"></p>
    </div>

    <h2> ¿Tomaste tu jugo?</h2>
    <button onclick="si">Si tome el jugo</button>

    <br>
    <button onclick="cerrarSesion()">Salir</button>
  </div>

  <script>
    // Si alguien entra directo sin login, lo mandamos al inicio
    const acceso = localStorage.getItem("acceso_ok");

    if (acceso !== "true") {
      window.location.href = "index.html";
    }

    // Mostrar saludo
    document.getElementById("saludo").innerText =
      "Hola amor 💕 gracias por dejarme jugar hoy";

    function hacerJugo() {
      const frutas = ["Manzana", "Plátano", "Frutilla", "Mango", "Piña", "Naranja"];
      const frutaRandom = frutas[Math.floor(Math.random() * frutas.length)];

      document.getElementById("resultadoJugo").innerText =
        "✨ Tu jugo sorpresa es de: " + frutaRandom + " 🍹";
    }

    function cerrarSesion() {
      localStorage.removeItem("acceso_ok");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
