<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>secreto</title>
<style>
    body {
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
  </style>

</head>
<body>
  <p id="saludo"></p>
  
  <div id="juguera" style="display:none;">
  <h3>🍹 Jugo sorpresa</h3>
  <button onclick="hacerJugo()">Hacer jugo</button>
  <p id="resultadoJugo"></p>
</div>



  

  <script>
    
    function hacerJugo() {
    const frutas = ["Manzana", "Plátano", "Frutilla", "Mango", "Piña", "Naranja"];

    const frutaRandom = frutas[Math.floor(Math.random() * frutas.length)];

    document.getElementById("resultadoJugo").innerText =
      "✨ Tu jugo sorpresa es de: " + frutaRandom + " 🍹";
  }
  </script>
</body>
</html>
