<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SUPER SECRETO</title>
  <style>
     body {
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #FFC0CB;

      background-image: url("img/supersecreto.jpg");
      background-size: 250px 300px;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <h1>Premio secreto </h1>
  <p>Si llegaste aquí… significa que sí tomaste el jugo jij</p>
  <button class="boton-generico">Reclamar premio</button>
  <img id="imagen" src="./fotosupersecreto.jpg" alt="Imagen secreta" style="display: none; width: 300px; border-radius: 10px; margin-top: 20px;">
  </body>

  <script>
  const boton = document.getElementById("mostrarImagen");
  const imagen = document.getElementById("imagen");

  boton.addEventListener("click", () => {
    // Cambia el display de la imagen para que se vea
    if (imagen.style.display === "none") {
      imagen.style.display = "block";
    } else {
      // opcional: si quieres que desaparezca al volver a hacer clic
      imagen.style.display = "none";
    }
  });
</script>
  
</html>
